<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポケふた管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ポケふた管理</h1>
    <div class="header-actions">
      <button id="exportBtn" class="export-btn">📥 エクスポート</button>
      <button id="importBtn" class="import-btn">📤 インポート</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
    </div>
    <div id="progress" class="progress"></div>
  </header>

  <main class="container">
    <div id="summary" class="summary"></div>

    <div class="toolbar">
      <button id="backBtn" class="hidden">← 戻る</button>
      <button id="addBtn" class="hidden">＋ 新しいポケふた</button>
      <button id="viewModeBtn" class="hidden">📷 ギャラリー</button>
    </div>

    <ul id="list" class="list"></ul>

    <section id="formPanel" class="modal-overlay hidden">
      <div class="modal-content">
        <h2 id="formTitle">ポケふたを登録</h2>
        <form id="futaForm">
          <label>
            <span>名前</span>
            <input type="text" id="name" required maxlength="50" placeholder="ポケふたの名前">
          </label>

          <label>
            <span>訪問日</span>
            <input type="date" id="date">
          </label>

          <label>
            <span>写真</span>
            <input type="file" id="photo" accept="image/*">
          </label>

          <div id="imagePreview" class="image-preview hidden">
            <img id="previewImage" alt="写真プレビュー">
          </div>

          <div class="form-buttons">
            <button type="button" id="cancelBtn" class="secondary">キャンセル</button>
            <button type="submit" class="primary">保存</button>
          </div>
        </form>
      </div>
    </section>

    <section id="cropModal" class="modal-overlay hidden">
      <div class="modal-content crop-modal-content">
        <h2>画像を正方形にトリミング</h2>
        <div class="crop-wrapper">
          <canvas id="cropCanvas"></canvas>
        </div>
        <div class="crop-buttons">
          <label>
            トリミングサイズ
            <input type="range" id="cropSizeSlider" min="10" max="100" value="80">
          </label>
          <button type="button" id="cropApplyBtn" class="primary">適用</button>
          <button type="button" id="cropCancelBtn" class="secondary">キャンセル</button>
        </div>
      </div>
    </section>

    <section id="imagePreviewModal" class="image-preview-modal hidden">
      <div class="image-preview-overlay" id="imagePreviewOverlay">
        <img id="largeImage" class="large-image" alt="画像プレビュー">
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
